name: Verify KIXO
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kixo
          POSTGRES_PASSWORD: kixo_test_password
          POSTGRES_DB: kixo_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U kixo -d kixo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kixo:kixo_test_password@127.0.0.1:5434/kixo_test?schema=public
      TEST_BASE_URL: http://localhost:3100
      NEXTAUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXTAUTH_SECRET: isolated-ci-secret-not-for-production-123456789
      NEXT_PUBLIC_STORE_MODE: demo
      APP_MODE: demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run test:db:migrate
      - run: npm run test:db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Do not upload traces, storage state, .env files or database dumps.
