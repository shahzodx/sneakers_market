services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS URL}
        NEXT_PUBLIC_STORE_MODE: ${NEXT_PUBLIC_STORE_MODE:-demo}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    env_file: .env.production
    restart: unless-stopped
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
