services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kixo
      POSTGRES_USER: kixo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kixo_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kixo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kixo"]
      interval: 5s
      retries: 10
volumes:
  kixo_postgres:
